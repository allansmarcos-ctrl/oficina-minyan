<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficina do Minyan</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
  :root{
    --night:#030711; --night-deep:#0e1b38; --ivory:#f2ede2; --ivory-dim:#b9b4a6; --ok:#7ddf9a;
    --ac:#c9a45c; --ac-bright:#e8cf94; --detail:#4fd1d9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(120% 90% at 50% -10%, var(--night-deep) 0%, var(--night) 55%) fixed var(--night);
    color:var(--ivory); font:16px/1.6 "Hanken Grotesk",system-ui,sans-serif;
    min-height:100vh; padding:30px 18px 120px; display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  .kicker{font-size:11.5px;letter-spacing:.22em;color:var(--ac);text-transform:uppercase;font-weight:600}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:600;color:var(--ac-bright);font-size:clamp(32px,8.5vw,50px);margin:10px 0 2px}
  .sub{color:var(--ivory-dim);font-size:14.5px;margin:0 0 24px}
  .card{width:min(430px,100%);background:rgba(233,207,148,.045);border:1px solid rgba(201,164,92,.32);border-radius:14px;padding:24px 20px;margin-bottom:14px}
  .num{font-family:"Fraunces",Georgia,serif;font-size:60px;line-height:1;color:var(--ac-bright);font-variant-numeric:tabular-nums}
  .num-label{color:var(--ivory-dim);font-size:14px;margin-top:4px}
  .meta-linha{font-size:12.5px;color:var(--ivory-dim);margin-top:6px}
  .btn{display:block;width:100%;margin-top:16px;padding:14px;border:none;border-radius:10px;background:linear-gradient(180deg,var(--ac-bright),var(--ac));color:#211703;font:600 16px "Hanken Grotesk",sans-serif;cursor:pointer}
  .btn.off{background:none;border:1px solid rgba(201,164,92,.45);color:var(--ivory-dim);font-weight:500}
  .btn:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--detail);outline-offset:2px}
  .anon{font-size:12.5px;color:var(--ivory-dim);margin-top:10px}
  .anon b{color:var(--detail)}
  .sec-title{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ac);font-weight:600;margin-bottom:10px}
  .dots{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:330px;margin:0 auto}
  .dot{width:14px;height:14px;border-radius:99px;background:var(--ok);box-shadow:0 0 7px rgba(125,223,154,.5)}
  .dot.hoje{background:transparent;border:2px dashed rgba(125,223,154,.75);box-shadow:none}
  .frase{margin-top:12px;font-family:"Fraunces",Georgia,serif;font-size:18px}
  .frase b{color:var(--ok)}
  .aviso{border-left:3px solid var(--detail);text-align:left;padding:10px 14px;background:rgba(79,209,217,.06);border-radius:0 9px 9px 0;font-size:14.5px}
  .aviso .tag{font-size:10.5px;letter-spacing:.18em;color:var(--detail);text-transform:uppercase;font-weight:600;display:block;margin-bottom:3px}
  footer{margin-top:14px;color:var(--ivory-dim);font-size:12px;line-height:1.7}
  footer .assina{color:var(--ac);font-weight:600}

  .nasce{animation:acender .9s ease-out}
  @keyframes acender{from{opacity:0;transform:translateY(14px) scale(.97);filter:brightness(2.2)}to{opacity:1;transform:none;filter:none}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

  /* ---------- gênese (o jogo de construir) ---------- */
  .genese{position:fixed;inset:0;z-index:70;background:rgba(3,7,17,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .genese.escondida{display:none}
  .g-caixa{width:min(460px,100%)}
  .g-pergunta{font-family:"Fraunces",Georgia,serif;font-size:clamp(22px,6vw,30px);color:var(--ivory);margin:0 0 6px;text-wrap:balance}
  .g-dica{font-size:13.5px;color:var(--ivory-dim);margin:0 0 18px}
  .g-input{width:100%;padding:14px;border-radius:10px;border:1px solid rgba(201,164,92,.5);background:rgba(233,207,148,.06);color:var(--ivory);font:16px "Hanken Grotesk",sans-serif;text-align:center}
  .g-input::placeholder{color:rgba(185,180,166,.45)}
  .g-acentos{display:flex;gap:10px;margin-top:6px}
  .g-acentos button{flex:1;padding:16px 8px;border-radius:10px;border:2px solid transparent;cursor:pointer;font:600 14px "Hanken Grotesk",sans-serif}
  .ac-dourado{background:linear-gradient(180deg,#e8cf94,#c9a45c);color:#211703}
  .ac-turquesa{background:linear-gradient(180deg,#8ee6ec,#4fd1d9);color:#052a2d}
  .ac-ambar{background:linear-gradient(180deg,#f4c07a,#d9a35a);color:#2a1804}
  .g-avancar{margin-top:16px}
  .g-progresso{position:fixed;left:0;right:0;top:0;height:4px;background:rgba(233,207,148,.12)}
  .g-progresso i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac-bright));transition:width .5s ease;box-shadow:0 0 12px rgba(232,207,148,.6)}
  .g-pecas{position:fixed;top:12px;right:14px;font-size:11.5px;letter-spacing:.14em;color:var(--ivory-dim);text-transform:uppercase}
  .g-pular{margin-top:22px;background:none;border:none;color:rgba(185,180,166,.5);font-size:12px;cursor:pointer;text-decoration:underline}

  /* ---------- modo construtor livre ---------- */
  .fab{position:fixed;right:14px;bottom:14px;z-index:60;background:#151d33;border:1px solid rgba(201,164,92,.5);color:var(--ac-bright);border-radius:99px;padding:11px 18px;font:600 14px "Hanken Grotesk",sans-serif;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.55)}
  body.editando .fab{background:var(--ac);color:#211703}
  .painel{position:fixed;left:0;right:0;bottom:0;z-index:55;background:#0b1224;border-top:2px solid var(--ac);padding:14px 16px 18px;display:none;max-height:56vh;overflow-y:auto;text-align:left}
  body.editando .painel{display:block}
  .painel h2{font-family:"Fraunces",serif;color:var(--ac-bright);font-size:18px;margin:0 0 4px}
  .painel .dica{font-size:12.5px;color:var(--ivory-dim);margin:0 0 12px}
  .p-grid{display:grid;gap:8px;grid-template-columns:1fr;max-width:640px;margin:0 auto}
  .p-sec{display:flex;align-items:center;gap:8px;background:rgba(233,207,148,.06);border:1px solid rgba(201,164,92,.25);border-radius:8px;padding:8px 10px;font-size:13.5px}
  .p-sec .nome{flex:1}
  .p-sec button{background:#1a2440;border:1px solid rgba(201,164,92,.35);color:var(--ivory);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px}
  .p-sec button[disabled]{opacity:.3;cursor:default}
  .p-sec .olho.off{color:#777;text-decoration:line-through}
  .p-acentos{display:flex;gap:8px;margin:10px auto;max-width:640px}
  .p-acentos button{flex:1;padding:9px;border-radius:8px;border:2px solid transparent;cursor:pointer;font:600 13px "Hanken Grotesk",sans-serif}
  .p-acentos .sel{border-color:#fff}
  .p-acoes{display:flex;gap:10px;max-width:640px;margin:14px auto 0;flex-wrap:wrap}
  .p-acoes .btn{margin:0;flex:1;min-width:180px}
  .status{font-size:12.5px;color:var(--ivory-dim);text-align:center;margin-top:8px;min-height:16px;word-break:break-all}
  body.editando [data-ed]{outline:1.5px dashed rgba(79,209,217,.6);outline-offset:3px;border-radius:4px;cursor:text;min-height:1em}
  body.editando [data-ed]:focus{outline:2px solid var(--detail)}
  .selo-visita{position:fixed;left:14px;top:12px;font-size:10.5px;letter-spacing:.14em;color:rgba(185,180,166,.6);text-transform:uppercase}
</style>
</head>
<body>
<span class="selo-visita" id="selo"></span>
<div id="app"></div>

<div class="genese" id="genese">
  <div class="g-progresso"><i id="gBarra" style="width:0%"></i></div>
  <div class="g-pecas" id="gPecas"></div>
  <div class="g-caixa" id="gCaixa"></div>
</div>

<button class="fab escondida" id="fab" style="display:none">🔧 Modo construtor</button>
<div class="painel" id="painel">
  <h2>Sua bancada</h2>
  <p class="dica">Toca em qualquer texto lá em cima pra mudar. Aqui: ordem, ligar/desligar e a alma do site. Tudo salva sozinho neste aparelho.</p>
  <div class="p-grid" id="pSecoes"></div>
  <div class="p-acentos" id="pAcentos"></div>
  <div class="p-acoes">
    <button class="btn" id="btnLink">📤 Meu site tá pronto — gerar link</button>
    <button class="btn off" id="btnZap">Abrir no WhatsApp</button>
    <button class="btn off" id="btnRecomecar">Recomeçar do zero</button>
  </div>
  <div class="status" id="status"></div>
</div>

<script>
(function(){
  "use strict";
  var ACENTOS = {
    dourado:  {ac:"#c9a45c", bright:"#e8cf94", detail:"#4fd1d9"},
    turquesa: {ac:"#4fd1d9", bright:"#8ee6ec", detail:"#c9a45c"},
    ambar:    {ac:"#d9a35a", bright:"#f4c07a", detail:"#7ddf9a"}
  };
  var NOMES = {hero:"Título e abertura", contador:"Contador anônimo", corrente:"A corrente", aviso:"Aviso do dia", rodape:"Rodapé com sua assinatura"};
  var PADRAO = {
    kicker:"Selichot da meia-noite · Beit Yaakov", titulo:"", subtitulo:"",
    meta:10, confirmadosBase:7, streak:0,
    fraseAnonimo:"Ninguém vê quem confirmou — e dá pra desistir a qualquer hora, sem cobrança.",
    fraseCorrente:"noites seguidas com minyan. Hoje a gente não quebra.",
    avisoTexto:"", rodape:"Selichot da meia-noite · Beit Yaakov", construtor:"",
    ordem:["hero","contador","corrente","aviso","rodape"],
    ligadas:{hero:true,contador:true,corrente:true,aviso:true,rodape:true},
    acento:"dourado", pronto:false
  };
  var K = "oficina-minyan-v1";
  var E = null, editando = false, modoVisita = false;

  function b64e(s){ return btoa(String.fromCharCode.apply(null, new TextEncoder().encode(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
  function b64d(s){ s = s.replace(/-/g,"+").replace(/_/g,"/"); while (s.length % 4) s += "=";
    return new TextDecoder().decode(Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); })); }

  // carga: hash (visita a uma criação) > localStorage (minha obra) > padrão (gênese)
  try {
    if (location.hash.length > 8){ E = JSON.parse(b64d(location.hash.slice(1))); modoVisita = true; }
  } catch(err){ E = null; }
  if (!E){ try { E = JSON.parse(localStorage.getItem(K) || "null"); } catch(err){ E = null; } }
  var fezGenese = !!(E && E.pronto);
  if (!E) E = JSON.parse(JSON.stringify(PADRAO));

  function salvarLocal(){ if (!modoVisita) try { localStorage.setItem(K, JSON.stringify(E)); } catch(e){} }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function ed(campo, txt, tag, cls){
    tag = tag || "div";
    return "<"+tag+" class='"+(cls||"")+"' data-ed='"+campo+"'"+(editando?" contenteditable='true' spellcheck='false'":"")+">"+esc(txt)+"</"+tag+">";
  }

  function aplicarAcento(){
    var a = ACENTOS[E.acento] || ACENTOS.dourado;
    document.documentElement.style.setProperty("--ac", a.ac);
    document.documentElement.style.setProperty("--ac-bright", a.bright);
    document.documentElement.style.setProperty("--detail", a.detail);
  }

  function render(anima){
    aplicarAcento();
    document.body.classList.toggle("editando", editando);
    document.getElementById("selo").textContent = modoVisita ? "criação de " + (E.construtor || "alguém do minyan") : (fezGenese ? "oficina · obra sua" : "");
    var app = document.getElementById("app");
    var eu = localStorage.getItem(K + "-eu") === "1";
    var blocos = {
      hero: function(){ return "<div>"+ed("kicker", E.kicker, "div", "kicker")+ed("titulo", E.titulo || "…", "h1")+ed("subtitulo", E.subtitulo || "", "p", "sub")+"</div>"; },
      contador: function(){
        var total = (E.confirmadosBase|0) + (eu?1:0);
        return "<div class='card'><div class='num'>"+total+"</div><div class='num-label'>confirmados pra hoje</div>"+
          "<div class='meta-linha'>precisamos de "+(E.meta|0)+" · faltam <b style='color:var(--ac-bright)'>"+Math.max(0,(E.meta|0)-total)+"</b></div>"+
          "<button class='btn"+(eu?" off":"")+"' data-acao='confirmar'>"+(eu?"Desistir (sem vergonha)":"Confirmar presença — anônimo")+"</button>"+
          "<div class='anon'><b>Anônimo de verdade.</b> "+esc(E.fraseAnonimo)+"</div></div>";
      },
      corrente: function(){
        var dots = ""; for (var i=0;i<(E.streak|0);i++) dots += "<span class='dot'></span>";
        dots += "<span class='dot hoje' title='hoje — em aberto'></span>";
        return "<div class='card'><div class='sec-title'>A corrente</div><div class='dots'>"+dots+"</div>"+
          "<div class='frase'><b>"+(E.streak|0)+"</b> "+ed("fraseCorrente", E.fraseCorrente, "span")+"</div></div>";
      },
      aviso: function(){ return "<div class='card aviso'><span class='tag'>Aviso de hoje</span>"+ed("avisoTexto", E.avisoTexto || "…", "span")+"</div>"; },
      rodape: function(){ return "<footer>"+ed("rodape", E.rodape, "div")+(E.construtor?"<div class='assina'>construído por "+esc(E.construtor)+"</div>":"")+"</footer>"; }
    };
    var html = "";
    (E.ordem||[]).forEach(function(sec){ if (E.ligadas[sec] !== false && blocos[sec]) html += "<div class='"+(anima===sec?"nasce":"")+"'>"+blocos[sec]()+"</div>"; });
    app.innerHTML = html;
    renderPainel();
    salvarLocal();
  }

  function renderPainel(){
    var ps = document.getElementById("pSecoes"); ps.innerHTML = "";
    (E.ordem||[]).forEach(function(sec, i){
      var row = document.createElement("div"); row.className = "p-sec";
      row.innerHTML = "<span class='nome'>"+esc(NOMES[sec]||sec)+"</span>"+
        "<button data-mv='-1' data-i='"+i+"' "+(i===0?"disabled":"")+">↑</button>"+
        "<button data-mv='1' data-i='"+i+"' "+(i===E.ordem.length-1?"disabled":"")+">↓</button>"+
        "<button class='olho"+(E.ligadas[sec]===false?" off":"")+"' data-olho='"+sec+"'>"+(E.ligadas[sec]===false?"ligar":"visível")+"</button>";
      ps.appendChild(row);
    });
    var pa = document.getElementById("pAcentos"); pa.innerHTML = "";
    Object.keys(ACENTOS).forEach(function(nome){
      var b = document.createElement("button");
      b.className = "ac-"+nome + (E.acento===nome ? " sel" : "");
      b.textContent = nome; b.setAttribute("data-acento", nome);
      pa.appendChild(b);
    });
  }

  // ---------- a gênese: construir do zero ----------
  var PASSOS = [
    {campo:null, pergunta:"Aqui não tem nada. Ainda.", dica:"Você vai construir o site do minyan, peça por peça. Do zero. Pronto?", botao:"Começar a construir", tipo:"intro"},
    {campo:"titulo", pergunta:"Toda coisa viva tem nome. Qual é o nome?", dica:"É o que aparece em letras grandes. (Ideia que rolou no minyan: Minyan Am Echad. Mas o nome é seu.)", tipo:"texto", placeholder:"escreve o nome aqui"},
    {campo:"subtitulo", pergunta:"Agora uma frase que diz o que é.", dica:"Curta. Tipo um lema. (Ex.: Todo mundo junto na meia-noite.)", tipo:"texto", placeholder:"a frase do site"},
    {campo:"acento", pergunta:"Escolhe a alma do site.", dica:"A cor que acende tudo. Dá pra trocar depois.", tipo:"acento"},
    {campo:"meta", pergunta:"O coração: o contador anônimo. Quantos vocês precisam por noite?", dica:"Minyan = 10. Mas o número é da sua régua.", tipo:"numero", placeholder:"10"},
    {campo:"streak", pergunta:"A corrente: quantas noites seguidas vocês já têm?", dica:"Cada noite conquistada vira uma bolinha verde. Zero também é começo.", tipo:"numero", placeholder:"0"},
    {campo:"avisoTexto", pergunta:"Escreve o primeiro aviso do dia.", dica:"O que faria alguém vir HOJE? (bolinho? shiur? pessoa surpresa?)", tipo:"texto", placeholder:"hoje tem…"},
    {campo:"construtor", pergunta:"Assina a obra.", dica:"Seu nome ou apelido aparece no rodapé: construído por ___. (Pode deixar vazio se preferir mistério.)", tipo:"texto", placeholder:"quem construiu isso?"}
  ];
  var passoAtual = 0;

  function mostrarGenese(){
    var g = document.getElementById("genese"), cx = document.getElementById("gCaixa");
    var p = PASSOS[passoAtual];
    if (!p){
      E.pronto = true; fezGenese = true; salvarLocal();
      g.classList.add("escondida");
      document.getElementById("fab").style.display = "";
      render();
      return;
    }
    document.getElementById("gBarra").style.width = Math.round(100*passoAtual/PASSOS.length) + "%";
    document.getElementById("gPecas").textContent = passoAtual > 0 ? ("peça " + passoAtual + " de " + (PASSOS.length-1)) : "";
    var html = "<p class='g-pergunta'>"+esc(p.pergunta)+"</p><p class='g-dica'>"+esc(p.dica)+"</p>";
    if (p.tipo === "texto" || p.tipo === "numero")
      html += "<input class='g-input' id='gIn' "+(p.tipo==="numero"?"type='number' inputmode='numeric'":"type='text'")+" placeholder='"+esc(p.placeholder||"")+"' autocomplete='off'>";
    if (p.tipo === "acento")
      html += "<div class='g-acentos'><button class='ac-dourado' data-g-acento='dourado'>dourado</button><button class='ac-turquesa' data-g-acento='turquesa'>turquesa</button><button class='ac-ambar' data-g-acento='ambar'>âmbar</button></div>";
    if (p.tipo !== "acento")
      html += "<button class='btn g-avancar' id='gOk'>"+esc(p.botao || "Colocar a peça")+"</button>";
    if (passoAtual === 0 && (localStorage.getItem(K)))
      html += "<button class='g-pular' id='gPular'>já construí antes — continuar minha obra</button>";
    cx.innerHTML = html;
    var inp = document.getElementById("gIn"); if (inp) setTimeout(function(){ inp.focus(); }, 60);

    function avancar(valor){
      if (p.campo){
        if (p.tipo === "numero") E[p.campo] = Math.max(0, parseInt(valor||"0", 10) || 0);
        else if (p.campo) E[p.campo] = (valor||"").trim() || (p.campo==="titulo" ? "Minyan Am Echad" : E[p.campo]);
      }
      if (p.campo === "rodape" || p.campo === "construtor") E.rodape = E.rodape || PADRAO.rodape;
      passoAtual++;
      aplicarAcento();
      // a página vai nascendo ATRÁS do véu conforme constrói
      var mapa = {titulo:"hero", subtitulo:"hero", meta:"contador", streak:"corrente", avisoTexto:"aviso", construtor:"rodape"};
      render(mapa[p.campo]);
      mostrarGenese();
    }
    if (document.getElementById("gOk")) document.getElementById("gOk").onclick = function(){ avancar(inp ? inp.value : ""); };
    if (inp) inp.onkeydown = function(ev){ if (ev.key === "Enter") avancar(inp.value); };
    cx.querySelectorAll("[data-g-acento]").forEach(function(b){
      b.onclick = function(){ E.acento = b.getAttribute("data-g-acento"); avancar(); };
    });
    if (document.getElementById("gPular")) document.getElementById("gPular").onclick = function(){
      try { E = JSON.parse(localStorage.getItem(K)); } catch(e){}
      E.pronto = true; fezGenese = true;
      document.getElementById("genese").classList.add("escondida");
      document.getElementById("fab").style.display = "";
      render();
    };
  }

  // ---------- eventos do modo livre ----------
  function coletarEdicoes(){
    document.querySelectorAll("[data-ed]").forEach(function(el){
      var v = el.textContent.trim(); if (v === "…") v = "";
      E[el.getAttribute("data-ed")] = v;
    });
  }
  document.getElementById("fab").addEventListener("click", function(){
    if (editando) coletarEdicoes();
    editando = !editando; render();
    this.textContent = editando ? "👁 Ver como visitante" : "🔧 Modo construtor";
  });
  document.getElementById("painel").addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    coletarEdicoes();
    var st = document.getElementById("status");
    if (b.hasAttribute("data-mv")){
      var i = +b.getAttribute("data-i"), d = +b.getAttribute("data-mv");
      var t = E.ordem[i]; E.ordem[i] = E.ordem[i+d]; E.ordem[i+d] = t; render();
    } else if (b.hasAttribute("data-olho")){
      var s = b.getAttribute("data-olho"); E.ligadas[s] = E.ligadas[s] === false; render();
    } else if (b.hasAttribute("data-acento")){
      E.acento = b.getAttribute("data-acento"); render();
    } else if (b.id === "btnLink"){
      var url = location.origin + location.pathname + "#" + b64e(JSON.stringify(E));
      var fecho = function(ok){ st.textContent = ok ? "Link copiado! Cola no grupo ou manda pro Allan. Quem abrir vê a SUA criação." : ("Copia o link: " + url); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(function(){ fecho(true); }, function(){ fecho(false); });
      else fecho(false);
    } else if (b.id === "btnZap"){
      var url2 = location.origin + location.pathname + "#" + b64e(JSON.stringify(E));
      window.open("https://wa.me/?text=" + encodeURIComponent("Construí o site do minyan. Abre aí: " + url2), "_blank", "noopener");
    } else if (b.id === "btnRecomecar"){
      if (confirm("Apagar a sua obra deste aparelho e começar do zero?")){
        localStorage.removeItem(K); location.hash = ""; location.reload();
      }
    }
  });
  document.getElementById("app").addEventListener("click", function(e){
    var b = e.target.closest("[data-acao='confirmar']"); if (!b || editando) return;
    var k2 = K + "-eu";
    localStorage.setItem(k2, localStorage.getItem(k2)==="1" ? "0" : "1");
    render();
  });

  // ---------- partida ----------
  if (modoVisita){
    document.getElementById("genese").classList.add("escondida");
    render();
  } else if (fezGenese){
    document.getElementById("genese").classList.add("escondida");
    document.getElementById("fab").style.display = "";
    render();
  } else {
    render(); mostrarGenese();
  }
})();
</script>
</body>
</html>
